shot_id: demo_bullet_time_sd15revisit
technique: orbit_bullet_time
narrative_note: >
  demo_bullet_time과 동일 샷(파라미터 그대로)을 SD1.5+AnimateDiff+IPAdapter-FaceID
  백엔드로 재시도. 2026-10-23 중단 이유는 "더미 메시 depth가 회전을 전혀 반영 못 해서"
  였는데, 2026-10-27 depth 정규화 버그(CompositorNodeNormalize -> MapRange)를 고쳐서
  코/턱/몸통이 또렷이 보이는 depth맵이 나오는 것까지 확인됨 — 당시 중단 원인이 해소됐는지
  재검증하는 샷. VACE 쪽(demo_bullet_time.yaml)과 1:1 비교용으로 shot_id만 분리.
params:
  radius: 0.45
  height: 1.45
  arc_height: 0.08
  arc_degrees: 180
  duration_s: 1.5
  fov_deg: 50

# SD1.5 레거시 경로는 전처리(rembg 흰배경) 없이 원본 그대로 사용한다
# (comfyui/workflow_builder.py 주석, colab 노트북 cell 9의 SUBJECT_IMAGE_SRC 분기 참고).
# VACE용 subject_ref_clean.png(흰배경)과 다른 파일이므로 혼동 주의.
subject_image_path: /content/subject_ref.png
subject_image_local_path: "C:\\!Ahn\\Corporation\\##. 기획\\05. 매출가능사업구상\\01. SNS 채널운영(AI 제작)\\00. 콘텐츠 제작 자동화\\11. Morphic Studio\\01. 모픽 워크플로우 개발\\10. 클로드 모핑 워크플로우 파이프라인 개발\\01. 연출구축 플로우\\subject_ref.png"
positive_prompt: >
  cinematic photoreal subject, bullet time orbit shot, consistent identity, sharp focus, frozen motion, dramatic lighting
negative_prompt: blurry, distorted anatomy, extra limbs, low quality, motion blur on subject

backend: sd15_animatediff
use_ip_adapter_faceid: true
# 2026-10-28: denoise=0.75(기본값) 결과 — 정체성은 유지됐으나 카메라가 거의 정지(회전 미반영).
# 36프레임 latent가 전부 동일 원본 이미지에서 시작해 25%가 그대로 남아 ControlNet 회전
# 신호를 억누르는 것으로 추정 — denoise를 올려 재시도.
sd15_denoise: 0.95
